<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agradecimento - Capão da Canoa | DestinoTec</title>
    <link rel="stylesheet" href="https://destinotec.com.br/wp-includes/css/dist/block-library/style.min.css">
    <link rel="stylesheet" href="https://destinotec.com.br/wp-content/themes/businessup/style.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 50px;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #182b42;
            font-size: 2.5rem;
        }
        p {
            font-size: 1.2rem;
            color: #333;
        }
        .btn-home {
            margin-top: 20px;
            background-color: #182b42;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            transition: background-color 0.3s;
        }
        .btn-home:hover {
            background-color: #0a1b30;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Obrigado pelo seu contato!</h1>
        <p>Recebemos sua mensagem e entraremos em contato o mais breve possível.</p>
        <p>Enquanto isso, você pode continuar navegando pelo nosso site.</p>
        <a class="btn-home" href="https://destinotec.com.br/">Voltar para a página inicial</a>
    </div>
</body>
</html>
